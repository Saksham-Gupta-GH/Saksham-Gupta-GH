    <rect x="400" y="160" width="38" height="38" fill="#44b459" rx="2" />
    <rect x="400" y="120" width="38" height="38" fill="#34A853" rx="2" />
    
    <!-- Head -->
    <g filter="drop-shadow(0 0 4px #fff)">
        <rect x="440" y="120" width="40" height="40" fill="#ffffff" rx="4" />
