    <rect x="466" y="126" width="6" height="6" fill="#0d1117" />
    <rect x="466" y="146" width="6" height="6" fill="#0d1117" />
  </g>

  <!-- Food -->
  <g filter="drop-shadow(0 0 6px #EA4335)">
      <circle cx="580" cy="140" r="16" fill="#EA4335" />
  </g>

